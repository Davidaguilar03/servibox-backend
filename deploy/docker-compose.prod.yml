# ServiBox en un VPS: PostgreSQL 16, backend y Caddy (HTTPS automatico).
# Uso desde esta carpeta: docker compose -f docker-compose.prod.yml up -d
# Variables en .env (copiar de .env.example). Ver docs/deploy/VPS.md.
# Solo Caddy publica puertos; postgres y backend quedan en la red interna.

name: servibox

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging: *logging

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    image: servibox-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Caddy fija X-Real-IP con la IP real del cliente y el puerto 8080 no se publica.
      PUBLIC_RATE_LIMIT_CLIENT_IP_HEADER: X-Real-IP
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    mem_limit: 900m
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.servibox.co}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-servibox.co}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:

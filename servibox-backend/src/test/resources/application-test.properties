# H2 en memoria en modo PostgreSQL, con el esquema de Flyway y ddl-auto=validate. Cada
# contexto de Spring tiene su propia base (nombre con ${random.uuid}), asi que arranca con
# el esquema limpio, como pasaba con create-drop. Ver 03-DECISIONS.md.
spring.datasource.url=jdbc:h2:mem:servibox-test-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
servibox.platform.jwt.secret=test-only-platform-secret-never-for-production-2026
servibox.mail.outbox.encryption-key=test-only-outbox-key-never-for-production-2026
servibox.activation.base-url=https://app.example.invalid
# Las pruebas llaman a OutboxWorker directamente; sin tarea programada en segundo plano.
servibox.mail.outbox.scheduler-enabled=false

# Limite de tasa por IP apagado: MockMvc manda todo desde 127.0.0.1. PublicRateLimitTest lo enciende.
servibox.rate-limit.enabled=false
# Proteccion de logins apagada: muchas pruebas hacen logins fallidos desde 127.0.0.1.
# LoginThrottleTest la enciende.
servibox.login-throttle.enabled=false

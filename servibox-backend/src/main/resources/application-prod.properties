# PostgreSQL real. La clave no tiene valor por defecto: sin DB_PASSWORD la app no arranca.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false

# SERVER_PORT conserva la precedencia habitual de Spring; con Docker Compose no hace falta definir ninguno.
server.port=${PORT:8080}
servibox.jwt.secret=${JWT_SECRET:}

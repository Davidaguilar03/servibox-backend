spring.application.name=servibox-backend

# JWT. En produccion JWT_SECRET debe venir de una variable de entorno real: el valor por
# defecto de abajo es solo para desarrollo local y nunca debe usarse en un despliegue.
servibox.jwt.secret=${JWT_SECRET:dev-secret-cambiar-en-produccion-minimo-32-caracteres}
servibox.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
servibox.platform.jwt.secret=${PLATFORM_JWT_SECRET:}
servibox.platform.jwt.expiration-ms=${PLATFORM_JWT_EXPIRATION_MS:900000}

# Zona de negocio: de ella sale el "hoy" de las fechas por defecto (ventas, compras,
# movimientos, abonos y pagos). Es un id de java.time.ZoneId. La auditoria sigue en UTC.
servibox.business.time-zone=${BUSINESS_TIME_ZONE:America/Bogota}

# Tope de filas del reporte de movimientos exportado (GET /api/reporting/export). Con mas,
# 400 pidiendo acotar el rango. Las pruebas lo bajan para no crear 20000 movimientos.
servibox.reporting.max-export-rows=${REPORTING_MAX_EXPORT_ROWS:20000}

# Registro publico de servitecas (POST /api/auth/register). En false responde 403 y no crea
# nada.
servibox.registration.enabled=${REGISTRATION_ENABLED:true}

# Solicitudes de registro (POST /api/registration-requests, tarea 4A). En false la ruta
# responde 404 como no disponible. En true el registro inmediato de arriba responde 403:
# nunca quedan las dos vias publicas abiertas. Plazos: duraciones de Spring (7d, 48h);
# los valores por defecto son una propuesta, no confirmada.
servibox.registration-requests.enabled=${REGISTRATION_REQUESTS_ENABLED:false}
servibox.registration-requests.pending-reservation=${REGISTRATION_REQUESTS_PENDING_RESERVATION:7d}
servibox.registration-requests.approved-reservation=${REGISTRATION_REQUESTS_APPROVED_RESERVATION:30d}
servibox.registration-requests.idempotency-retention=${REGISTRATION_REQUESTS_IDEMPOTENCY_RETENTION:48h}

# Activacion de cuentas (tarea 4B). Vigencia del token, intervalo minimo entre reenvios y
# reenvios por solicitud en 24 h: propuesta, no confirmada. La URL base del enlace
# /activar#token=... la fija el servidor, nunca el header Host; prod exige https.
servibox.registration-requests.activation-token-ttl=${REGISTRATION_ACTIVATION_TOKEN_TTL:24h}
servibox.registration-requests.resend-cooldown=${REGISTRATION_ACTIVATION_RESEND_COOLDOWN:60s}
servibox.registration-requests.resend-daily-limit=${REGISTRATION_ACTIVATION_RESEND_DAILY_LIMIT:5}
servibox.activation.base-url=${ACTIVATION_BASE_URL:}

# Outbox de correo. La clave cifra el cuerpo pendiente (al menos 32 bytes, propia, sin valor
# por defecto). Sin SMTP_HOST no hay transporte: los correos quedan PENDING y la app arranca.
# Aceptado por el transporte (SENT) no significa entregado al buzon.
servibox.mail.outbox.encryption-key=${MAIL_OUTBOX_ENCRYPTION_KEY:}
servibox.mail.outbox.poll-interval=${MAIL_OUTBOX_POLL_INTERVAL:30s}
servibox.mail.outbox.max-attempts=${MAIL_OUTBOX_MAX_ATTEMPTS:6}
servibox.mail.outbox.retry-backoff=${MAIL_OUTBOX_RETRY_BACKOFF:1m}
servibox.mail.smtp.host=${SMTP_HOST:}
servibox.mail.smtp.port=${SMTP_PORT:587}
servibox.mail.smtp.username=${SMTP_USERNAME:}
servibox.mail.smtp.password=${SMTP_PASSWORD:}
servibox.mail.from=${MAIL_FROM:}

# Esquema: lo crea Flyway con las migraciones de db/migration; Hibernate solo lo valida.
# Igual en todos los perfiles. Ver Base de datos en docs/ai-context/01-ARCHITECTURE.md.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# Espera maxima por un bloqueo de fila (SELECT ... FOR UPDATE de cuentas, productos y
# facturas), en milisegundos. Pasado ese tiempo la peticion responde 409 en vez de esperar
# indefinidamente. Ver Bloqueos en 02-CONVENTIONS.md.
spring.jpa.properties.jakarta.persistence.lock.timeout=5000

# Local: H2 en memoria en modo PostgreSQL. Como antes, los datos se pierden al apagar la
# app; con el perfil dev DevDataInitializer siembra los datos de prueba. El perfil prod
# (application-prod.properties) apunta a PostgreSQL.
spring.datasource.url=jdbc:h2:mem:servibox;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
